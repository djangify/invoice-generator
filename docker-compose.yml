services:
  web:
    build: .
    container_name: invoice_generator_web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # database, logo, saved PDFs and the generated keys / first_login.txt
      - ./data:/app/data
    ports:
      # Only reachable from this computer. Change to "8000:8000" to share on your network.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 30s
      timeout: 10s
      retries: 5

  scheduler:
    build: .
    container_name: invoice_generator_scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Run recurring invoice check daily at 6:00 AM (adjust as needed)
      - SCHEDULE_HOUR=6
      - SCHEDULE_MINUTE=0
    volumes:
      - ./data:/app/data
    depends_on:
      web:
        condition: service_healthy
    command: [ "/bin/bash", "/app/scheduler.sh" ]
