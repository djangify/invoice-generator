{% extends 'base.html' %}

{% block title %}Delete Client - Invoice Generator{% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-3xl font-semibold text-gray-900">Delete Client</h1>
</div>

<div class="bg-white border border-gray-200 rounded-lg p-6 max-w-2xl">
    <p class="text-gray-700 mb-6">
        Are you sure you want to delete <strong>{{ client.name }}</strong>? This action cannot be undone.
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="flex justify-end space-x-3">
            <a href="{% url 'invoices:client_list' %}" 
               class="px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                Cancel
            </a>
            <button type="submit" 
                    class="px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700">
                Delete Client
            </button>
        </div>
    </form>
</div>
{% endblock %}
