{% extends 'invoices/base.html' %}

{% block title %}Password Changed - Invoice Generator{% endblock %}

{% block content %}
<div class="max-w-lg">
    <div class="bg-white border border-gray-200 rounded-lg p-8 text-center">
        <div class="mb-6">
            <svg class="mx-auto h-12 w-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        
        <h1 class="text-2xl font-semibold text-gray-900 mb-2">Password Changed</h1>
        <p class="text-gray-600 mb-6">
            Your password has been successfully updated.
        </p>

        <a href="{% url 'invoices:dashboard' %}" 
           class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-gray-900 hover:bg-gray-800">
            Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
